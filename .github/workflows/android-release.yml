name: Mashareenaa Cloud Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest

    env:
      ORG_GRADLE_PROJECT_ciDebugSigning: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Universal APK (all Flutter-supported Android ABIs)
        run: >
          flutter build apk --release
          --obfuscate
          --split-debug-info=build/symbols
          --dart-define=MASHA_BUILD_CHANNEL=ci-universal-test

      - name: Verify Universal APK contains supported ABIs
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libflutter.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libflutter.so"
          unzip -l "$APK" | grep -q "lib/x86_64/libflutter.so"
          echo "Universal APK contains armeabi-v7a, arm64-v8a and x86_64."

      - name: Verify Universal APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Verify Universal APK alignment
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk

      - name: Build App Bundle (obfuscated, CI test signed)
        run: >
          flutter build appbundle --release
          --obfuscate
          --split-debug-info=build/symbols

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: mashareenaa-universal-apk-installable-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: mashareenaa-android-aab-test
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Dart symbols (private CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mashareenaa-dart-symbols-private
          path: build/symbols
          if-no-files-found: error
          retention-days: 14
