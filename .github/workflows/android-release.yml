name: Mashareenaa Cloud Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build split APKs (obfuscated, CI test signed)
        run: >
          flutter build apk --release
          --split-per-abi
          --obfuscate
          --split-debug-info=build/symbols
          --dart-define=MASHA_BUILD_CHANNEL=ci-test
          -PciDebugSigning=true

      - name: Verify ARM64 APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Verify APK alignment
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Build App Bundle (obfuscated, CI test signed)
        run: >
          flutter build appbundle --release
          --obfuscate
          --split-debug-info=build/symbols
          -PciDebugSigning=true

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: mashareenaa-apk-armeabi-v7a-installable-test
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: mashareenaa-apk-arm64-v8a-installable-test
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: mashareenaa-apk-x86_64-installable-test
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: mashareenaa-android-aab-test
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Dart symbols (private CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mashareenaa-dart-symbols-private
          path: build/symbols
          if-no-files-found: error
          retention-days: 14
