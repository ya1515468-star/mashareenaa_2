name: Mashareenaa ARM64 APK
on:
  push:
    branches:
      - build/arm64-20260922
permissions:
  contents: read
jobs:
  build-arm64:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_ciDebugSigning: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build ARM64 APK
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --obfuscate
          --split-debug-info=build/symbols
          --dart-define=MASHA_BUILD_CHANNEL=arm64
      - name: Verify APK is ARM64-only
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/"
          if unzip -l "$APK" | grep -Eq "lib/(armeabi-v7a|x86|x86_64|armeabi|mips|mips64)/"; then
            echo "Unexpected non-ARM64 native library found in APK:"
            unzip -l "$APK" | grep -E "lib/(armeabi-v7a|x86|x86_64|armeabi|mips|mips64)/"
            exit 1
          fi
          echo "ARM64-only native library payload confirmed."
      - name: Show APK size
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - name: Verify alignment
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk
      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/mashareenaa-arm64-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mashareenaa-arm64-release
          path: build/app/outputs/flutter-apk/mashareenaa-arm64-release.apk
          if-no-files-found: error
          retention-days: 14
