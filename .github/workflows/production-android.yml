name: Mashareenaa Production Android Release
# Lean production build: release R8 shrinking + Play Store AAB + one ARM64 sideload APK + private symbols.

on:
  workflow_dispatch:
  push:
    branches:
      - "release/global-production-20260921"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: production-android-optimized
  cancel-in-progress: true

jobs:
  android-release:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Validate production signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MASHAREENA_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MASHAREENA_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MASHAREENA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MASHAREENA_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production signing secret: $name"
              exit 1
            fi
          done

      - name: Prepare production signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MASHAREENA_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MASHAREENA_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MASHAREENA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MASHAREENA_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p android
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/mashareena-upload.p12
          cat > android/key.properties <<EOF
          storeFile=mashareena-upload.p12
          storeType=PKCS12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          test -s android/mashareena-upload.p12
          chmod 600 android/mashareena-upload.p12 android/key.properties

      - name: Build release AAB
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Verify lean release outputs
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$AAB"
          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

          echo "Production outputs:"
          du -h "$AAB" "$APK"
          echo "Private symbols:"
          du -sh build/symbols

          if find build/app/outputs/flutter-apk -maxdepth 1 -type f \
            \( -name '*armv7*' -o -name '*armeabi-v7a*' -o -name '*x86_64*' \) \
            -print -quit | grep -q .; then
            echo "::error::Unexpected extra ABI APK detected."
            exit 1
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mashareena-production-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mashareena-production-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mashareena-production-symbols
          path: build/symbols/**
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f android/mashareena-upload.p12 android/key.properties
