name: Mashareenaa Production Android Release

on:
  workflow_dispatch:
  push:
    branches: ["release/global-production-20260921"]

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G"
      KEYSTORE_BASE64: ${{ secrets.MASHAREENA_UPLOAD_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.MASHAREENA_UPLOAD_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.MASHAREENA_UPLOAD_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.MASHAREENA_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Prepare production signing
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p android
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/mashareena-upload.jks
          cat > android/key.properties <<EOF
          storeFile=mashareena-upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          test -s android/mashareena-upload.jks

      - name: Build release AAB
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-x86_64-release.apk
          echo "AAB/APKs exist and APK signatures verify."

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mashareena-production-android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*-release.apk
            build/symbols/**
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f android/mashareena-upload.jks android/key.properties
