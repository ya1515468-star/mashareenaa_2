name: Mashareena Production Bootstrap Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Generate production upload key
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"
          KEY_ALIAS="mashareenaUpload"
          mkdir -p release-secrets
          keytool -genkeypair -v \
            -keystore android/mashareena-upload.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Mashareena, OU=Production, O=Mashareena, L=Toronto, ST=Ontario, C=CA"
          cat > android/key.properties <<EOF
          storeFile=mashareena-upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          cat > release-secrets/credentials.txt <<EOF
          Key Alias: $KEY_ALIAS
          Store Password: $STORE_PASSWORD
          Key Password: $KEY_PASSWORD
          EOF
          keytool -list -v -keystore android/mashareena-upload.jks -storepass "$STORE_PASSWORD" > release-secrets/certificate.txt
          sha256sum android/mashareena-upload.jks > release-secrets/keystore.sha256

      - name: Build signed production AAB
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Build signed production APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Verify signed outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/bundle/release/app-release.aab
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            test -s "$apk"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --verbose "$apk"
          done
          zipinfo -1 build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -q 'lib/arm64-v8a/libflutter.so'
          zipinfo -1 build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk | grep -q 'lib/armeabi-v7a/libflutter.so'
          zipinfo -1 build/app/outputs/flutter-apk/app-x86_64-release.apk | grep -q 'lib/x86_64/libflutter.so'

      - name: Package release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          cp build/app/outputs/bundle/release/app-release.aab release-bundle/
          cp build/app/outputs/flutter-apk/*-release.apk release-bundle/
          cp android/mashareena-upload.jks release-bundle/
          cp release-secrets/credentials.txt release-bundle/
          cp release-secrets/certificate.txt release-bundle/
          cp release-secrets/keystore.sha256 release-bundle/
          (cd release-bundle && sha256sum *) > release-bundle/SHA256SUMS.txt

      - name: Upload production release bundle
        uses: actions/upload-artifact@v4
        with:
          name: mashareena-production-release-bundle
          path: release-bundle
          if-no-files-found: error
          retention-days: 30
