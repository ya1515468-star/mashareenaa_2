plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "0.1.0"

android {
    namespace = "com.mashareena.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId = "com.mashareena.app"
        minSdk = 24
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ARM64 release APKs must not carry the extra native plugin binaries
    // for unrelated Android ABIs. Flutter's target-platform selects the
    // Flutter engine ABI, while prebuilt plugin JNI libraries may otherwise
    // remain packaged.
    packaging {
        jniLibs {
            excludes += [
                "**/armeabi-v7a/**",
                "**/x86/**",
                "**/x86_64/**",
                "**/armeabi/**",
                "**/mips/**",
                "**/mips64/**"
            ]
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "com.google.android.play:core:1.10.3"
}

// CI test signing only. A real production keystore must be supplied through
// protected CI secrets before store distribution.
if (project.hasProperty("ciDebugSigning")) {
    android.buildTypes.release.signingConfig = android.signingConfigs.debug
}
