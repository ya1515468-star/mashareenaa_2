org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Added: this project links several native plugins at once (agora_rtc_engine,
# camera, record, image_picker), which makes a cold Gradle build noticeably
# slower and, on some machines, prone to timing out. These three are safe,
# well-established Gradle settings that speed up and stabilize exactly that
# situation — none of them change what gets built, only how efficiently.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
