<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mashareena Fashion Engine</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#070b10;color:#fff;font-family:system-ui,Arial}#canvas{position:absolute;inset:0}#ui{position:fixed;z-index:9;top:10px;left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap}.card{background:#0d131de8;border:1px solid #ffffff16;border-radius:14px;padding:9px;backdrop-filter:blur(10px)}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:9px;padding:8px 10px;background:#6e35c5;color:#fff;font-weight:700}.btn.s{background:#213142}.field{width:70px;background:#0b121b;border:1px solid #2b4056;color:#fff;border-radius:8px;padding:7px}.sw{width:27px;height:27px;border:2px solid #fff8;border-radius:50%}#panel{display:none;position:fixed;z-index:10;left:10px;bottom:10px;width:min(520px,calc(100vw - 20px));max-height:45vh;overflow:auto}.pieces{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.piece{background:#121e2a;border:1px solid #2a425c;border-radius:8px;padding:7px;text-align:center;font-size:10px}#stats{position:fixed;z-index:10;bottom:7px;right:7px;background:#0009;padding:7px;border-radius:8px;font-size:10px;color:#aebccb}</style></head><body><canvas id="canvas"></canvas><div id="ui"><div class="card row"><button class="btn" onclick="setGarment('hoodie')">Hoodie</button><button class="btn" onclick="setGarment('shirt')">Shirt</button><button class="btn" onclick="setGarment('jacket')">Jacket</button><button class="btn" onclick="setGarment('dress')">Dress</button></div><div class="card row"><b>cm</b><input id="chest" class="field" type="number" value="96" oninput="rebuild()"><input id="waist" class="field" type="number" value="80" oninput="rebuild()"><input id="hip" class="field" type="number" value="100" oninput="rebuild()"><input id="length" class="field" type="number" value="68" oninput="rebuild()"></div><div class="card row"><button class="btn s" onclick="fabric('Cotton',.18,.70)">Cotton</button><button class="btn s" onclick="fabric('Jersey',.42,.95)">Jersey</button><button class="btn s" onclick="fabric('Denim',.08,.35)">Denim</button><button class="sw" style="background:#7b2cbf" onclick="setColor('#7b2cbf')"></button><button class="sw" style="background:#d4af37" onclick="setColor('#d4af37')"></button><button class="sw" style="background:#191c22" onclick="setColor('#191c22')"></button></div><div class="card row"><button class="btn" onclick="toggleSimulation()">محاكاة القماش</button><button class="btn s" onclick="togglePanel()">Gerber 2D</button><button class="btn s" onclick="exportSVG()">SVG</button><button class="btn s" onclick="exportDXF()">DXF</button><button class="btn s" onclick="exportGLTF()">GLB</button></div></div><div id="panel" class="card"><b>Gerber / Pattern</b><div id="pieces" class="pieces"></div></div><div id="stats">Parametric 2D Pattern + 3D Garment Preview • القياسات الحالية مؤثرة فعلياً</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/controls/OrbitControls.js';import{GLTFExporter}from'https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/exporters/GLTFExporter.js';
const canvas=document.getElementById('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b10);const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);cam.position.set(0,1.1,5.5);const ctl=new OrbitControls(cam,renderer.domElement);ctl.enableDamping=true;ctl.target.set(0,.15,0);scene.add(new THREE.HemisphereLight(0xffffff,0x203040,2));const dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(3,5,4);scene.add(dl);const floor=new THREE.Mesh(new THREE.CircleGeometry(3.1,64),new THREE.MeshStandardMaterial({color:0x131b24,roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.35;scene.add(floor);let group=new THREE.Group();scene.add(group);let style='hoodie',color=0x7b2cbf,sim=false;let fab={name:'Cotton',stiff:.18,damp:.70};const n=id=>Number(document.getElementById(id).value)||0;const size=()=>({chest:n('chest')||96,waist:n('waist')||80,hip:n('hip')||100,length:n('length')||68});const material=()=>new THREE.MeshPhysicalMaterial({color,roughness:fab.damp,metalness:.02,clearcoat:.08,sheen:.14});function mannequin(){const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0xd3a07d,roughness:1});const b=new THREE.Mesh(new THREE.CapsuleGeometry(.62,1.7,12,24),m);b.position.y=-.25;g.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(.43,28,22),m);h.position.y=1.45;g.add(h);return g}function garment(t){const s=size(),k=s.chest/96,g=new THREE.Group(),m=material();if(t==='dress'){const q=new THREE.Mesh(new THREE.CylinderGeometry(.62*k,.98*(s.hip/100),2.2*(s.length/68),72,28,true),m);q.position.y=-.05;g.add(q)}else{const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.72*k,.95*(s.length/68),18,34),m);torso.scale.set(1,.98,.64);torso.position.y=-.18;g.add(torso);for(const side of[-1,1]){const arm=new THREE.Mesh(new THREE.CylinderGeometry(.18*k,.23*k,1.55,26),m);arm.position.set(.89*k*side,.02,0);arm.rotation.z=.18*side;g.add(arm)}const collar=new THREE.Mesh(new THREE.TorusGeometry(.35*k,.08,16,32),m);collar.rotation.x=Math.PI/2;collar.position.y=.63;g.add(collar);if(t==='hoodie'){const hood=new THREE.Mesh(new THREE.TorusGeometry(.35*k,.13,16,32,Math.PI),m);hood.rotation.x=Math.PI/2;hood.position.y=.67;g.add(hood)}}return g}function pieces(){const s=size(),seam=1.0,c=s.chest/2+2;return[{name:'Front',w:c,h:s.length},{name:'Back',w:c,h:s.length},{name:'Sleeve',w:Math.max(12,s.length*.7/4),h:Math.max(48,s.length*.7)},{name:'Collar',w:12,h:4}]}function rebuild(){while(group.children.length)group.remove(group.children[0]);group.add(mannequin());group.add(garment(style));const box=document.getElementById('pieces');box.innerHTML='';for(const p of pieces()){const el=document.createElement('div');el.className='piece';el.innerHTML=`<b>${p.name}</b><br>${p.w.toFixed(1)}×${p.h.toFixed(1)}cm<br>SA 1cm`;box.appendChild(el)}}function fabric(name,stiff,damp){fab={name,stiff,damp};rebuild()}window.fabric=fabric;window.setGarment=t=>{style=t;rebuild()};window.setColor=c=>{color=parseInt(c.slice(1),16);rebuild()};window.toggleSimulation=()=>{sim=!sim};window.togglePanel=()=>{const e=document.getElementById('panel');e.style.display=e.style.display==='block'?'none':'block'};function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}window.exportSVG=()=>{let x=20,y=20,svg='<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900"><rect width="100%" height="100%" fill="white"/>';for(const p of pieces()){const w=p.w*8,h=p.h*8;svg+=`<g transform="translate(${x},${y})"><rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="black" stroke-width="2"/><text x="5" y="18" font-size="14">${p.name} ${p.w.toFixed(1)}x${p.h.toFixed(1)}cm SA 1cm</text></g>`;x+=360;if(x>1100){x=20;y+=h+60}}svg+='</svg>';download('mashareena-pattern.svg',svg,'image/svg+xml')};window.exportDXF=()=>{let d='0\nSECTION\n2\nENTITIES\n';for(const p of pieces()){const q=[[0,0],[p.w,0],[p.w,p.h],[0,p.h],[0,0]];for(let i=0;i<4;i++)d+=`0\nLINE\n8\n${p.name}\n10\n${q[i][0]}\n20\n${q[i][1]}\n11\n${q[i+1][0]}\n21\n${q[i+1][1]}\n`}d+='0\nENDSEC\n0\nEOF\n';download('mashareena-pattern.dxf',d,'application/dxf')};window.exportGLTF=()=>new GLTFExporter().parse(group,r=>download('mashareena-garment.glb',r,'model/gltf-binary'),{binary:true});let t=0;function loop(){requestAnimationFrame(loop);t+=.01;ctl.update();if(sim){group.position.y=Math.sin(t*3)*(.01+fab.stiff*.04);group.rotation.z=Math.sin(t*1.7)*(1-fab.damp)*.02}else{group.position.y=0;group.rotation.z=0}renderer.render(scene,cam)}rebuild();loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
